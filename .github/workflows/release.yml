name: Release
on:
  push:
    branches:
      - main
      - beta

permissions:
  contents: read # for checkout

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # OIDC: npm Trusted Publishing (auth) + provenance attestation
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm CLI supports OIDC trusted publishing (needs >=11.5.1)
        run: npm install -g npm@latest

      - name: Install pnpm
        run: npm i pnpm@10 -g

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
        run: pnpm audit --audit-level=moderate

      - name: Lint
        run: pnpm lint
        continue-on-error: ${{ github.ref == 'refs/heads/beta' }}

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: '0'
        # No NPM_TOKEN: publishes via npm Trusted Publishing (OIDC), using the
        # id-token permission above. Requires a trusted publisher configured
        # on npmjs.com for this repo + workflow file per package. See
        # https://docs.npmjs.com/trusted-publishers
        run: pnpm release
